name: Release xcross

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Shared with the existing integration workflow's native Windows toolchain.
  LLVM_VERSION: 22.1.8
  LLVM_WINDOWS_SHA256: 16E5709785FEF73C854646241C4A92C5CD574318D1B33C63330DD7721903E55C

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Required to sign the SLSA provenance attestation with the run's OIDC
      # identity, proving the archive came out of this workflow at this commit.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: xcross-linux-x64
          - runner: ubuntu-24.04-arm
            asset: xcross-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Python for upstream Dart build tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Dart
        # v1
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Install snapshotter build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 clang lld llvm build-essential

      - name: Analyze
        run: dart analyze

      - name: Test
        run: |
          (cd packages/xcross && dart test)
          dart test packages/cli_kit
          dart test packages/apple_developer_kit
          dart test packages/darwin_sdk_kit
          dart test packages/dart_mobile_device
          dart test packages/frontend_server_kit

      - name: Validate pub.dev package
        working-directory: packages/xcross
        run: dart pub publish --dry-run

      - name: Build xcross
        working-directory: packages/xcross
        env:
          XCROSS_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'unreleased' }}
          XCROSS_BUILD_RELEASED: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: >-
          dart run
          "-DXCROSS_VERSION=${XCROSS_BUILD_VERSION}"
          "-DXCROSS_RELEASED=${XCROSS_BUILD_RELEASED}"
          tool/build_xcross.dart

      - name: Compile binary
        run: |
          mkdir -p dist
          # Bundle layout is bin/ + lib/ (native assets). Ship as tar.gz.
          tar -C packages/xcross/build/cli/*/bundle \
            -czf "dist/${{ matrix.asset }}.tar.gz" bin lib

      - name: Verify distributed Linux AOT compiler
        run: |
          mkdir -p smoke
          tar -xzf "dist/${{ matrix.asset }}.tar.gz" -C smoke
          smoke/bin/xcross --help >/dev/null
          dart run packages/xcross/tool/verify_ios_aot_bundle.dart smoke
          dart run packages/xcross/tool/verify_snapshotter.dart smoke

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        # v4.1.1
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: dist/${{ matrix.asset }}.tar.gz

      - name: Upload binary artifacts
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build xcross-windows-x64
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Python for upstream Dart build tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Dart
        # v1
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260
        with:
          sdk: stable

      - name: Install snapshotter build requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:RUNNER_TEMP\llvm-installer.exe"
          $llvmRoot = "$env:RUNNER_TEMP\llvm-$env:LLVM_VERSION"
          $url = "https://github.com/llvm/llvm-project/releases/download/" +
            "llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"
          Invoke-WebRequest $url -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $env:LLVM_WINDOWS_SHA256) {
            throw 'LLVM installer checksum mismatch'
          }
          $process = Start-Process $installer -ArgumentList '/S', "/D=$llvmRoot" `
            -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'LLVM installation failed' }
          "$llvmRoot\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      # bash, not the pwsh default: GitHub only propagates $LASTEXITCODE from
      # the final line of a pwsh `run` block, so a failing `dart test` on any
      # earlier line is silently swallowed and the job reports success. bash
      # with `set -e` fails the step on the first non-zero command.
      - name: Verify Dart code
        shell: bash
        run: |
          set -euo pipefail
          dart pub get
          dart analyze
          (cd packages/xcross && dart test)
          dart test packages/cli_kit
          (cd packages/apple_developer_kit && dart test)
          dart test packages/darwin_sdk_kit
          dart test packages/dart_mobile_device
          dart test packages/frontend_server_kit

      - name: Build xcross
        shell: pwsh
        working-directory: packages/xcross
        env:
          XCROSS_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'unreleased' }}
          XCROSS_BUILD_RELEASED: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          dart run `
            "-DXCROSS_VERSION=$env:XCROSS_BUILD_VERSION" `
            "-DXCROSS_RELEASED=$env:XCROSS_BUILD_RELEASED" `
            tool/build_xcross.dart

      - name: Compile binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse `
            packages/xcross/build/cli/windows_x64/bundle/bin dist/bin
          Copy-Item -Recurse `
            packages/xcross/build/cli/windows_x64/bundle/lib dist/lib

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force dist/THIRD_PARTY_LICENSES | Out-Null
          Copy-Item LICENSE dist/LICENSE
          Copy-Item `
            packages/apple_developer_kit/ADI_LICENSE `
            dist/THIRD_PARTY_LICENSES/provision-dart.txt
          Compress-Archive -Path dist/* -DestinationPath xcross-windows-x64.zip

      - name: Smoke-test Windows archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive xcross-windows-x64.zip smoke
          $expected = @(
            'LICENSE'
            'THIRD_PARTY_LICENSES/provision-dart.txt'
            'bin/xcross.exe'
            'bin/xcrun.exe'
            'lib/sysv_abi_bridge.dll'
            'lib/gen_snapshot_ios_arm64.exe'
            'lib/xcross-ios-aot-manifest.json'
            'lib/ios-aot-NOTICES.txt'
          ) | Sort-Object
          $root = Resolve-Path smoke
          $actual = Get-ChildItem smoke -File -Recurse | ForEach-Object {
            [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
          } | Sort-Object
          if (Compare-Object $expected $actual) {
            throw "Unexpected archive contents: $actual"
          }

          & smoke/bin/xcross.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'xcross.exe --help failed' }

          dart run packages/xcross/tool/verify_ios_aot_bundle.dart smoke
          if ($LASTEXITCODE -ne 0) { throw 'Bundled AOT compiler discovery failed' }
          dart run packages/xcross/tool/verify_snapshotter.dart smoke
          if ($LASTEXITCODE -ne 0) { throw 'Packaged iOS AOT compilation failed' }

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        # v4.1.1
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: xcross-windows-x64.zip

      - name: Upload Windows artifact
        # v7
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: xcross-windows-x64
          path: xcross-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download binaries
        # v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true

      # Gate: refuse to publish anything that is not provably the output of
      # this workflow, built from this commit. A hand-uploaded or swapped
      # artifact has no matching attestation and fails here.
      - name: Verify build provenance of downloaded artifacts
        env:
          SOURCE_DIGEST: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          for asset in \
            xcross-linux-x64.tar.gz \
            xcross-linux-arm64.tar.gz \
            xcross-windows-x64.zip; do
            echo "==> verifying $asset"
            gh attestation verify "dist/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$SOURCE_DIGEST" \
              --source-ref "$SOURCE_REF" \
              --deny-self-hosted-runners
          done

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            xcross-linux-x64.tar.gz \
            xcross-linux-arm64.tar.gz \
            xcross-windows-x64.zip >SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create and publish release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          cat >notes.md <<EOF
          ### Verifying this release

          Every archive below carries a signed SLSA build provenance
          attestation binding it to commit \`$GITHUB_SHA\` and to this
          repository's release workflow:

          \`\`\`sh
          gh attestation verify xcross-linux-x64.tar.gz \\
            --repo $GITHUB_REPOSITORY \\
            --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml \\
            --source-digest $GITHUB_SHA
          \`\`\`

          \`SHA256SUMS.txt\` covers the same archives for plain integrity
          checks.
          EOF
          gh release create "$tag" \
            dist/xcross-linux-x64.tar.gz \
            dist/xcross-linux-arm64.tar.gz \
            dist/xcross-windows-x64.zip \
            dist/SHA256SUMS.txt \
            packages/apple_developer_kit/ADI_LICENSE \
            --title "$tag" \
            --notes-file notes.md \
            --generate-notes
